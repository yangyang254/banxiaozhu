<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>班小助 · 原型（可点击）</title>
<style>
  :root{
    --navy:#16233d; --ink:#1c2b45; --grey:#5b6b85; --line:#e3e9f4;
    --blue:#2f6fed; --blue-l:#eaf1ff; --orange:#f2762e; --orange-l:#fff2e9;
    --green:#12a075; --green-l:#e6f7f1; --red:#e5484d; --bg:#f4f7fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  a{color:inherit;text-decoration:none}
  .wrap{display:flex;min-height:100vh}

  /* 顶部条 */
  .top{height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 22px;gap:14px}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2f6fed,#5f9bff);display:grid;place-items:center;font-size:13px;font-weight:700}
  .top .name{font-weight:700;letter-spacing:.5px}
  .top .tag{font-size:12px;color:#9fb2d4;border:1px solid #35486b;padding:2px 8px;border-radius:20px}
  .top .spacer{flex:1}
  .who{display:flex;align-items:center;gap:6px;font-size:13px;color:#dbe4f5}
  .avatar{width:26px;height:26px;border-radius:50%;background:#2f6fed;display:grid;place-items:center;font-size:12px;font-weight:700}

  /* 侧栏 */
  .side{width:190px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;flex:none}
  .side .grp{font-size:11px;color:#93a1ba;letter-spacing:1px;margin:14px 10px 6px}
  .side a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:var(--grey);font-size:13.5px}
  .side a:hover{background:var(--bg);color:var(--ink)}
  .side a.on{background:var(--blue-l);color:var(--blue);font-weight:700}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}

  /* 主区 */
  .main{flex:1;padding:20px 26px 40px;min-width:0}
  .crumb{font-size:12px;color:#93a1ba;margin-bottom:10px}
  h1{font-size:21px;letter-spacing:.3px}
  h1 .sub{font-size:13px;color:var(--grey);font-weight:400;margin-left:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
  .row{display:flex;gap:14px}
  .row>*{min-width:0}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--blue);color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.orange{background:var(--orange)}
  .btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
  .btn.danger{background:#fff;color:var(--red);border-color:#f6cdcf}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px}
  .pill.ok{background:var(--green-l);color:var(--green)}
  .pill.warn{background:var(--orange-l);color:var(--orange)}
  .pill.blue{background:var(--blue-l);color:var(--blue)}
  .pill.grey{background:#eef1f7;color:var(--grey)}
  .muted{color:var(--grey);font-size:12.5px}
  .label{font-size:12px;color:var(--grey);margin-bottom:4px}
  .field{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .field:last-child{border-bottom:0}
  .field b{font-weight:700}
  .conf{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--green-l);color:var(--green)}
  .conf.low{background:var(--orange-l);color:var(--orange)}
  textarea,input[type=text],select,input[type=password]{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#fbfcff}
  textarea{min-height:110px;resize:vertical;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:9px 10px;font-size:12.5px}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  tr:nth-child(even) td{background:#f7f9fd}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi .k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .k .n{font-size:25px;font-weight:700;margin-top:6px}
  .kpi .k .n small{font-size:12px;font-weight:400;color:var(--grey)}
  .bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
  .bars i{flex:1;background:linear-gradient(180deg,#5f9bff,#2f6fed);border-radius:6px 6px 0 0;display:block}
  .tip{background:var(--blue-l);border-left:3px solid var(--blue);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;color:#28406b;margin-top:12px}
  .toast{position:fixed;right:22px;bottom:22px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(22,35,61,.12);padding:12px 16px;font-size:13px;max-width:330px}
  .toast .t{font-weight:700;margin-bottom:3px}
  .center{max-width:420px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
  .center h2{font-size:19px;margin-bottom:6px}
  .center .muted{margin-bottom:18px}
  .switch{display:flex;gap:8px;margin:10px 0 18px}
  .switch span{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--grey);font-size:13px}
  .switch span.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:700}
  .hl{background:#fff3c4;border-radius:3px;padding:0 2px}
  .bubble{display:inline-block;background:var(--orange);color:#fff;border-radius:12px 12px 12px 3px;padding:8px 12px;font-size:12.5px}
  .steps{display:flex;gap:8px;font-size:12px;color:var(--grey)}
  .steps b{color:var(--blue)}
  .foot{margin-top:18px;font-size:12px;color:#93a1ba;display:flex;gap:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- 小工具 ---------- */
const P = (s) => `<div class="pill ${s[0]}">${s[1]}</div>`;
function shell(active, title, sub, body, opts={}){
  const nav = [
    ["前台 · 学生视角", [
      ["p01","P-01 登录与角色选择"],["p02","P-02 通知解析"],["p03","P-03 解析结果卡片"],
      ["p04","P-04 我的待办"],["p05","P-05 提醒中心"],["p06","P-06 班级问答"],
      ["p07","P-07 班级资料库"],["p08","P-08 我的与设置"]
    ]],
    ["前台 · 班委视角", [
      ["p09","P-09 发布通知"],["p10","P-10 维护班级资料"]
    ]],
    ["后台 · 管理端", [
      ["a01","A-01 管理端登录"],["a02","A-02 数据看板"],["a03","A-03 用户管理"],
      ["a04","A-04 通知与待办"],["a05","A-05 资料审核"],["a06","A-06 日志与设置"]
    ]]
  ];
  const side = nav.map(([g,items])=>`<div class="grp">${g}</div>` +
      items.map(([id,t])=>`<a href="#/${id}" class="${id===active?'on':''}"><i class="dot"></i>${t}</a>`).join("")).join("");
  return `<div class="top">
      <div class="logo">助</div><div class="name">班小助</div>
      <div class="tag">校园事务智能体 · 原型 v1.0</div>
      <div class="spacer"></div>
      <div class="who"><span>${opts.role||'肖武阳 · 班委'}</span><div class="avatar">肖</div></div>
    </div>
    <div class="wrap">
      <div class="side">${side}</div>
      <div class="main">
        <div class="crumb">${opts.crumb||'班小助 / 前台'}</div>
        <h1>${title}${sub?`<span class="sub">${sub}</span>`:''}</h1>
        ${body}
        <div class="foot"><span>可点击原型 · 点击左侧菜单切换页面</span><span>下一屏：${opts.next||'—'}</span></div>
      </div>
    </div>`;
}

/* ---------- P-01 登录与角色选择 ---------- */
const p01 = () => shell("p01","登录与角色选择","无需密码：昵称 + 角色即可进入",`
  <div class="center" style="margin:6vh auto">
    <h2>欢迎使用班小助</h2>
    <div class="muted">把班级群里刷屏的通知，变成今天该做的那几件事。</div>
    <div class="label">你的昵称</div>
    <input type="text" value="肖武阳">
    <div class="label" style="margin-top:14px">你的角色</div>
    <div class="switch"><span class="on">班委（可发布）</span><span>普通同学</span></div>
    <div style="display:flex;gap:10px">
      <a class="btn" href="#/p02" style="flex:1;justify-content:center">进入班小助</a>
      <a class="btn ghost" href="#/a01">我是管理员</a>
    </div>
    <div class="tip">规则：<b>昵称唯一</b>，重名时提示「这个名字已经有人用了」；角色决定菜单可见性（班委多出「发布通知」「维护资料」两项）。不做账号密码，避免收集口令。</div>
  </div>`);

/* ---------- P-02 通知解析 ---------- */
const p02 = () => shell("p02","通知解析","把群里那条通知整段粘进来",`
  <div class="row">
    <div class="card" style="flex:1.35">
      <div class="label">粘贴通知原文（支持从 QQ / 微信直接复制）</div>
      <textarea>【通知】请各班班长于 11 月 8 日 18:00 前，将国家励志奖学金申请材料交到实验楼 A302 办公室。材料包括：成绩单、家庭经济困难证明、个人申请书（800 字以内）。逾期不再受理，请务必转达本班同学。</textarea>
      <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
        <a class="btn" href="#/p03">开始解析</a>
        <a class="btn ghost" href="#/p02">清空</a>
        <span class="muted">最近解析 3.2 秒 · 模型 deepseek-chat</span>
      </div>
      <div class="tip">交互规则：① 文本为空或少于 15 字时按钮置灰；② 解析中按钮显示「解析中…」并禁用，防止重复提交；③ 失败时保留原文并提示「模型没返回有效结果，已用规则抽取兜底」。</div>
    </div>
    <div class="card" style="flex:.9">
      <div class="label">示例通知（点一下直接填入）</div>
      ${["国家励志奖学金材料收集","英语四级报名与缴费","期末复习课安排"].map(t=>`
        <div class="field"><b>${t}</b><span class="muted">填入 →</span></div>`).join("")}
      <div class="tip">三条例题覆盖三类要素：<b>时间+地点+材料</b>、<b>时间+金额</b>、<b>时间+地点</b>，用来演示字段抽取的边界。</div>
    </div>
  </div>`);

/* ---------- P-03 解析结果卡片 ---------- */
const p03 = () => shell("p03","解析结果卡片","每个字段都能点回原文那一句",`
  <div class="row">
    <div class="card" style="flex:1.3">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><b style="font-size:16px">国家励志奖学金材料收集</b>
          <div class="muted" style="margin-top:4px">来源：班群「计科24级78班通知群」 · 原文 128 字</div></div>
        <div style="text-align:right"><div class="muted">整体置信度</div><div style="font-size:22px;font-weight:700;color:#12a075">95%</div></div>
      </div>
      <div style="margin-top:14px">
        <div class="field"><span class="label" style="margin:0">截止时间</span><span><b>2026-11-08 18:00</b> <i class="conf">可信 95%</i></span></div>
        <div class="field"><span class="label" style="margin:0">地点</span><span><b>实验楼 A302 办公室</b> <i class="conf">可信 88%</i></span></div>
        <div class="field"><span class="label" style="margin:0">材料</span><span><b>成绩单 / 家庭经济困难证明 / 个人申请书（800 字内）</b> <i class="conf">可信 92%</i></span></div>
        <div class="field"><span class="label" style="margin:0">要做什么</span><span>按材料清单准备并提交 <i class="conf low">待确认 72%</i></span></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <a class="btn" href="#/p05">＋ 加入我的待办</a>
        <a class="btn ghost" href="#/p04">去看待办 →</a>
        <a class="btn ghost" href="#/p02">重新解析</a>
      </div>
      <div class="tip">规则：置信度 <b>≥ 75%</b> 显示「可信」，<b>&lt; 75%</b> 标黄「待确认」并可点开修改；每个字段右侧可展开原文出处，出处句子逐字高亮；<b>只有点了「加入我的待办」才会生成待办</b>。</div>
    </div>
    <div class="card" style="flex:1">
      <div class="label">原文（字段出处高亮）</div>
      <div style="line-height:2.1;font-size:13.5px;color:#28374f">
        【通知】请各班班长于 <span class="hl">11 月 8 日 18:00</span> 前，将国家励志奖学金申请材料交到
        <span class="hl">实验楼 A302 办公室</span>。<br>材料包括：
        <span class="hl">成绩单、家庭经济困难证明、个人申请书（800 字以内）</span>。<br>逾期不再受理，请务必转达本班同学。
      </div>
      <div class="tip">如果模型给出的出处句子在原文里<b>找不到</b>，该字段判为「证据不足」，直接置空并要求人工补填，宁缺勿错。</div>
    </div>
  </div>`);

/* ---------- P-04 我的待办 ---------- */
const p04 = () => shell("p04","我的待办","按紧急程度排序，可编辑、可删除",`
  <div class="card">
    <div style="display:flex;gap:10px;margin-bottom:6px">
      ${P(["blue","全部 6"])}${P(["grey","今天 2"])}${P(["grey","本周 4"])}${P(["grey","已完成 11"])}
      <span class="spacer" style="flex:1"></span>
      <a class="btn ghost sm" href="#/p05">看提醒</a>
    </div>
    <div id="todos">
      ${[
        ["交国家励志奖学金材料","2026-11-08 18:00","warn","明天 18:00 截止","实验楼 A302 办公室"],
        ["英语四级报名缴费","2026-11-09 12:00","blue","后天 12:00 截止","教务系统线上缴费"],
        ["期末复习课（高数）","2026-11-10 19:00","grey","3 天后","教学楼 B203"]
      ].map(([t,d,pill,left,where])=>`
        <div style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)">
          <input type="checkbox" style="width:16px;height:16px">
          <div style="flex:1;min-width:0">
            <div><b>${t}</b> ${P([pill.includes("warn")?"warn":pill.includes("blue")?"blue":"grey", left])}</div>
            <div class="muted" style="margin-top:3px">截止 ${d} · ${where}</div>
          </div>
          <a class="btn ghost sm" href="#/p04">编辑</a>
          <a class="btn danger sm" href="#/p04">删除</a>
        </div>`).join("")}
    </div>
    <div class="tip">交互规则：① 勾选即标记完成，行变灰并移到「已完成」；② 点「编辑」在该行原地展开小表单（标题 + 截止时间，可直接清空时间），保存后<b>重新计算提醒</b>；③ 删除需二次确认，删除时连提醒一起删。</div>
  </div>
  <div class="card">
    <div class="label">行内编辑态（示意）</div>
    <div style="background:#f7f9ff;border:1px solid var(--line);border-radius:10px;padding:14px">
      <div class="label">标题</div><input type="text" value="交国家励志奖学金材料">
      <div class="label" style="margin-top:10px">截止时间</div><input type="text" value="2026-11-08T18:00">
      <div style="display:flex;gap:8px;margin-top:12px">
        <span class="btn sm">保存</span><span class="btn ghost sm">取消</span><span class="btn ghost sm">清空时间</span>
      </div>
    </div>
  </div>`);

/* ---------- P-05 提醒中心 ---------- */
const p05 = () => shell("p05","提醒中心","提前 1 天 / 2 小时 / 10 分钟，三档各一次",`
  <div class="row">
    <div class="card" style="flex:1.3">
      <table>
        <tr><th>提醒时间</th><th>档位</th><th>内容</th><th>状态</th></tr>
        <tr><td>11-07 18:00</td><td>${P(["grey","提前 1 天"])}</td><td>交国家励志奖学金材料 · 明天 18:00 截止</td><td>${P(["ok","已读"])}</td></tr>
        <tr><td>11-08 16:00</td><td>${P(["grey","提前 2 小时"])}</td><td>交国家励志奖学金材料 · 还有 2 小时</td><td>${P(["ok","已读"])}</td></tr>
        <tr><td>11-08 17:50</td><td>${P(["warn","提前 10 分钟"])}</td><td>交国家励志奖学金材料 · 10 分钟后截止</td><td>${P(["warn","待处理"])}</td></tr>
      </table>
      <div class="tip">规则：同一待办的同一档位<b>只生成一次</b>（数据库唯一约束兜底）；改截止时间后旧提醒作废重算；点「已读」写入确认时间，之后不再弹出。</div>
    </div>
    <div class="card" style="flex:1">
      <div class="label">页内气泡（前端每 30 秒轮询一次）</div>
      <div class="bubble">⏰ 交国家励志奖学金材料：10 分钟后截止</div>
      <div class="muted" style="margin-top:14px">点气泡 → 跳到对应待办；点「知道了」→ 本次不再提示。</div>
      <div class="tip">为什么用轮询：一周项目的取舍。<b>30 秒一次</b>足够准，实现只有十几行代码；换成 WebSocket 要多维护连接与重连。</div>
    </div>
  </div>`);

/* ---------- P-06 班级问答 ---------- */
const p06 = () => shell("p06","班级问答","答案必须带出处，资料里没有就说没有",`
  <div class="row">
    <div class="card" style="flex:1.3">
      <div class="label">你的问题</div>
      <div style="display:flex;gap:10px"><input type="text" value="学生证丢了怎么补办？"><a class="btn" href="#/p06">提问</a></div>
      <div style="margin-top:16px;line-height:1.9">
        <div style="font-weight:700;margin-bottom:6px">答：到实验楼 A302 办公室补办</div>
        <div>需要带：① 一寸照片 1 张；② 学生证补办申请表（班委处领取）；③ 工本费 10 元。</div>
        <div>办理时间：工作日 8:30–11:30、14:00–17:00，一般 3 个工作日可取。</div>
        <div class="muted" style="margin-top:10px">依据：班级资料第 1 条「学生证补办流程」（班委 2026-10-12 维护）</div>
        <div style="display:flex;gap:8px;margin-top:12px">${P(["ok","这条有用"])}${P(["grey","不准确，去纠错"])}</div>
      </div>
      <div class="tip">规则：① 只依据班级资料作答，资料里没有的就说「资料里没写，建议问辅导员」，<b>不许自由发挥</b>；② 每条回答必须列出依据条目；③ 用户点「不准确」进入纠错，纠错内容由班委审核后入库。</div>
    </div>
    <div class="card" style="flex:1">
      <div class="label">高频问题（点一下直接问）</div>
      ${["请假流程怎么走？","励志奖学金什么时候评？","四六级成绩单在哪打印？","教室怎么借用？"].map(q=>`
        <div class="field"><span>${q}</span><span class="muted">问 →</span></div>`).join("")}
